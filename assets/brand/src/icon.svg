<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 512 512" role="img" aria-label="RacketIQ">
  <title>RacketIQ</title>
  <!--
    RacketIQ — app icon composition.
    
    The background is part of the master, not something the script paints, so
    what you open in a browser is exactly what ships to the App Store. A Court
    Ink field lit from the top (a glass backed show court under lights) with
    one Optic bloom behind the sweet spot. No text, no rounded corners, no drop
    shadow: iOS and Android apply their own mask and anything baked in fights
    it. The gradients live outside the @mark-geometry markers so the block
    stays byte identical to mark.svg.
    
    FRAMING: this is the one file that crops the mark. A whole racquet is a
    long thin object, so fitting all of it inside a square leaves the head at
    about 40% of the canvas and the icon reads small and spindly. Here the
    head is set at 62% and the grip runs off the bottom edge instead, which is
    what makes the icon read at 40px in Spotlight. It exits at x 165 or so,
    well clear of the corner radius, and the head keeps a 10% margin at the
    top, so nothing essential is anywhere near the squircle's corners.
    mark.svg keeps the whole racquet for every other consumer.
  -->
  <defs>
    <clipPath id="racquetai-bed">
      <path d="M 0 -166 C 33.69 -166 61 -130.63 61 -87 C 61 -43.37 33.69 -8 0 -8 C -33.69 -8 -61 -43.37 -61 -87 C -61 -130.63 -33.69 -166 0 -166 Z" />
    </clipPath>
    <linearGradient id="racquetai-field" x1="0.12" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#0C2A1E" />
      <stop offset="0.55" stop-color="#08190F" />
      <stop offset="1" stop-color="#06130E" />
    </linearGradient>
    <radialGradient id="racquetai-bloom">
      <stop offset="0" stop-color="#7CBF3F" stop-opacity="0.24" />
      <stop offset="0.5" stop-color="#7CBF3F" stop-opacity="0.07" />
      <stop offset="1" stop-color="#7CBF3F" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="racquetai-sweetspot">
      <stop offset="0" stop-color="#A6D47D" stop-opacity="0.22" />
      <stop offset="1" stop-color="#7CBF3F" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#racquetai-field)" />
  <circle cx="270.0" cy="222.0" r="300" fill="url(#racquetai-bloom)" />
  <circle cx="270.0" cy="222.0" r="150" fill="url(#racquetai-sweetspot)" />
  <!-- @mark-geometry:start -->
  <g transform="translate(225.37 344.63) rotate(20) scale(1.5000)">
    <ellipse cx="0" cy="-87" rx="78" ry="96" fill="none" stroke="#7CBF3F" stroke-width="34" />
    <path d="M 66.24 -6 C 28.94 37.16 26 68.4 26 118 L 26 180 C 26 191.05 17.05 200 6 200 L -6 200 C -17.05 200 -26 191.05 -26 180 L -26 118 C -26 68.4 -28.94 37.16 -66.24 -6 Z" fill="#7CBF3F" />
    <g clip-path="url(#racquetai-bed)" opacity="0.18" stroke="#7CBF3F" stroke-width="2.8" stroke-linecap="round">
      <path d="M -58.5 -183 V 9 M -45.5 -183 V 9 M -32.5 -183 V 9 M -19.5 -183 V 9 M -6.5 -183 V 9 M 6.5 -183 V 9 M 19.5 -183 V 9 M 32.5 -183 V 9 M 45.5 -183 V 9 M 58.5 -183 V 9" />
      <path d="M -78 -158.5 H 78 M -78 -145.5 H 78 M -78 -132.5 H 78 M -78 -119.5 H 78 M -78 -106.5 H 78 M -78 -93.5 H 78 M -78 -80.5 H 78 M -78 -67.5 H 78 M -78 -54.5 H 78 M -78 -41.5 H 78 M -78 -28.5 H 78 M -78 -15.5 H 78" />
    </g>
    <path d="M -14.36 -126.47 C 0.14 -106.27 14.67 -99.49 39.47 -101.36 C 19.27 -86.86 12.49 -72.33 14.36 -47.53 C -0.14 -67.73 -14.67 -74.51 -39.47 -72.64 C -19.27 -87.14 -12.49 -101.67 -14.36 -126.47 Z" fill="#FFFFFF" />
  </g>
  <!-- @mark-geometry:end -->
</svg>
