<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="RacketIQ">
  <title>RacketIQ</title>
  <!--
    RacketIQ — monochrome mark.
    
    One flat colour, no string bed: survives Android's monochrome tinting, the
    notification silhouette, embroidery, laser etch and 1 bit print. Grid,
    transform and ink box are identical to mark.svg, so the two are
    interchangeable at any size.
    
    The spark survives the flatten because it is an island: it floats clear
    inside the frame with the empty string bed all around it, so it still
    reads as a spark when frame and spark are the same colour. That is the
    reason the spark is drawn rather than punched out of the frame.
    
    Recolour by swapping the three #FFFFFF values: Chalk on dark surfaces,
    Court Ink #06130E on light. See docs/04-branding.md.
  -->
  <!-- @mark-geometry:start -->
  <g transform="translate(235.25 256.85) rotate(20) scale(1.0416)">
    <ellipse cx="0" cy="-87" rx="78" ry="96" fill="none" stroke="#FFFFFF" stroke-width="34" />
    <path d="M 66.24 -6 C 28.94 37.16 26 68.4 26 118 L 26 180 C 26 191.05 17.05 200 6 200 L -6 200 C -17.05 200 -26 191.05 -26 180 L -26 118 C -26 68.4 -28.94 37.16 -66.24 -6 Z" fill="#FFFFFF" />
    <path d="M -14.36 -126.47 C 0.14 -106.27 14.67 -99.49 39.47 -101.36 C 19.27 -86.86 12.49 -72.33 14.36 -47.53 C -0.14 -67.73 -14.67 -74.51 -39.47 -72.64 C -19.27 -87.14 -12.49 -101.67 -14.36 -126.47 Z" fill="#FFFFFF" />
  </g>
  <!-- @mark-geometry:end -->
</svg>
