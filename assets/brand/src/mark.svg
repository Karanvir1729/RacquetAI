<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="RacquetAI">
  <title>RacquetAI</title>
  <!--
    RacquetAI — primary mark ("Ace Spark")

    CANONICAL GEOMETRY. splash.svg and wordmark.svg embed a copy of the block
    between the @mark-geometry markers; mark-mono.svg is the flattened variant.
    Change geometry here first, then mirror it. See docs/04-branding.md.

    Construction grid 512 x 512. Ink box measures 287 x 400 (78% of the grid
    tall) and is centred on (256,256) to the pixel — the outer translate is
    277.5/261.5 rather than 256/256 precisely because the racquet is a diagonal
    shape, so its tight ink box is not centred on its own rotation origin.
    Every consumer (icon, adaptive foreground, splash, favicon) can therefore
    scale this file about its centre and trust the result.

    Local space, before the transform:
      head    centre (0,-96), rx 116, ry 136, stroke 40
      bed     3 x 3 strings at 24% alpha, clipped to the inside of the head
      throat  struts leave the head at +/-32 deg, converge on the grip
      grip    52 x 152 pill, Optic
      spark   4-point star, r 76, counter-rotated +30 so it stays upright
    Tilt -30 deg, uniform scale 0.855.

    Colours: Chalk #FFFFFF frame, Optic #D8FA3C grip + spark. The frame is
    Chalk, so on light surfaces use mark-mono.svg filled Court Ink instead.
  -->
  <defs>
    <clipPath id="racquetai-bed">
      <ellipse cx="0" cy="-96" rx="96" ry="116" />
    </clipPath>
  </defs>
  <!-- @mark-geometry:start -->
  <g transform="translate(277.5 261.5) rotate(-30) scale(0.855) translate(0 -6)">
    <g clip-path="url(#racquetai-bed)" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="8" stroke-linecap="round">
      <path d="M -56 -240 V 40 M 0 -240 V 40 M 56 -240 V 40" />
      <path d="M -130 -160 H 130 M -130 -96 H 130 M -130 -32 H 130" />
    </g>
    <ellipse cx="0" cy="-96" rx="116" ry="136" fill="none" stroke="#FFFFFF" stroke-width="40" />
    <path d="M -61 19 L -20 128 M 61 19 L 20 128" fill="none" stroke="#FFFFFF" stroke-width="32" stroke-linecap="round" />
    <rect x="-26" y="112" width="52" height="152" rx="26" fill="#D8FA3C" />
    <path transform="translate(0 -96) rotate(30)" d="M 0 -76 Q 14 -14 76 0 Q 14 14 0 76 Q -14 14 -76 0 Q -14 -14 0 -76 Z" fill="#D8FA3C" />
  </g>
  <!-- @mark-geometry:end -->
</svg>
