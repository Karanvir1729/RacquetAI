<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 512 512" role="img" aria-label="RacquetAI">
  <title>RacquetAI</title>
  <!--
    RacquetAI — splash composition.
    
    Transparent background on purpose: expo-splash-screen paints Court Ink
    behind this image, so one PNG covers every device size and can never show a
    seam or a mismatched letterbox. The only addition over mark.svg is a soft
    Optic halo behind the sweet spot; its gradient reaches alpha 0 inside the
    canvas, so no hard square edge is ever visible.
    
    The mark sits at 65% ink, which at app.json imageWidth 180 puts it near
    117pt tall on device: the size Apple's launch screen guidance and
    expo-splash-screen's centred layout both suit.
    Geometry between the @mark-geometry markers is a copy of mark.svg.
  -->
  <defs>
    <clipPath id="racquetai-bed">
      <path d="M 0 -166 C 33.69 -166 61 -130.63 61 -87 C 61 -43.37 33.69 -8 0 -8 C -33.69 -8 -61 -43.37 -61 -87 C -61 -130.63 -33.69 -166 0 -166 Z" />
    </clipPath>
    <radialGradient id="racquetai-halo">
      <stop offset="0" stop-color="#7CBF3F" stop-opacity="0.22" />
      <stop offset="0.45" stop-color="#7CBF3F" stop-opacity="0.08" />
      <stop offset="1" stop-color="#7CBF3F" stop-opacity="0" />
    </radialGradient>
  </defs>
  <circle cx="264.5" cy="186.0" r="228" fill="url(#racquetai-halo)" />
  <!-- @mark-geometry:start -->
  <g transform="translate(238.77 256.70) rotate(20) scale(0.8645)">
    <ellipse cx="0" cy="-87" rx="78" ry="96" fill="none" stroke="#7CBF3F" stroke-width="34" />
    <path d="M 66.24 -6 C 28.94 37.16 26 68.4 26 118 L 26 180 C 26 191.05 17.05 200 6 200 L -6 200 C -17.05 200 -26 191.05 -26 180 L -26 118 C -26 68.4 -28.94 37.16 -66.24 -6 Z" fill="#7CBF3F" />
    <g clip-path="url(#racquetai-bed)" opacity="0.18" stroke="#7CBF3F" stroke-width="2.8" stroke-linecap="round">
      <path d="M -58.5 -183 V 9 M -45.5 -183 V 9 M -32.5 -183 V 9 M -19.5 -183 V 9 M -6.5 -183 V 9 M 6.5 -183 V 9 M 19.5 -183 V 9 M 32.5 -183 V 9 M 45.5 -183 V 9 M 58.5 -183 V 9" />
      <path d="M -78 -158.5 H 78 M -78 -145.5 H 78 M -78 -132.5 H 78 M -78 -119.5 H 78 M -78 -106.5 H 78 M -78 -93.5 H 78 M -78 -80.5 H 78 M -78 -67.5 H 78 M -78 -54.5 H 78 M -78 -41.5 H 78 M -78 -28.5 H 78 M -78 -15.5 H 78" />
    </g>
    <path d="M -14.36 -126.47 C 0.14 -106.27 14.67 -99.49 39.47 -101.36 C 19.27 -86.86 12.49 -72.33 14.36 -47.53 C -0.14 -67.73 -14.67 -74.51 -39.47 -72.64 C -19.27 -87.14 -12.49 -101.67 -14.36 -126.47 Z" fill="#FFFFFF" />
  </g>
  <!-- @mark-geometry:end -->
</svg>
